<html>
<head>
  <style>

    /* Elegant Blue Audio Button Styling */
    #audio-control {
      display: inline-block;
      margin: 10px auto;
      padding: 10px 25px;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #4a90e2 0%, #1a365d 100%);
      border: 2px solid #4a90e2;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(74, 144, 226, 0.4);
      transition: transform 0.2s ease;

      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(74, 144, 226, 0.6);
    }
  </style>

<body>

  <!-- Hidden Audio Element -->
  <audio id="bg-music" src="Song.mp3" loop></audio>

  <!-- Elegant Custom Button -->
  <div id="audio-control" onclick="toggleAudio()">▶ Beauty and the Beast</div>

  <img src="Pic1.HEIC">
  <div class="caption">Our first picture together - August 30th, 2025 - Bristol Renaissance Faire</div>
  
  <div id="anniversary-container">
    <div id="anniversary-clock"></div>
    <div id="anniversary-subtitle">Since the day I met you</div>
  </div>

  <style>
    #anniversary-container {
        text-align: center;
        padding: 25px 35px;
        background: linear-gradient(135deg, #fff8e7 0%, #ffd700 50%, #fff8e7 100%);
        border: 2px solid #d4af37;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        display: inline-block;
        margin: 20px auto;
    }

    #anniversary-clock {
        font-family: 'Georgia', serif;
        font-size: 2rem;
        font-weight: bold;
        color: #1a365d;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
    }

    #anniversary-subtitle {
        font-family: 'Georgia', serif;
        font-size: 1rem;
        font-style: italic;
        color: #4a5568;
        margin-top: 8px;
    }
  </style>

  <script>
    function updateClock() {
        const startDate = new Date('2025-08-14T00:00:00');
        const now = new Date();
        
        let years = now.getFullYear() - startDate.getFullYear();
        let months = now.getMonth() - startDate.getMonth();
        let days = now.getDate() - startDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
            days += prevMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById('anniversary-clock').innerText = 
            `${years} Years, ${months} Months, ${days} Days`;
    }

    updateClock();
    setInterval(updateClock, 1000 * 60 * 60 * 24);

    const audio = document.getElementById('bg-music');
    const control = document.getElementById('audio-control');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        control.innerText = "⏸ Beauty and the Beast";
      } else {
        audio.pause();
        control.innerText = "▶ Beauty and the Beast";
      }
    }
  </script>

  <div style="text-align: center; margin-top: 20px;">

    <a href="letter.html" class="romantic-button">One Year Dating Anniversary Letter</a>
  </div>
