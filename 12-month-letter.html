<html>
<head>
  <style>
    .github-copyright-banner, .github-copyright-banner a { display: none !important; }
    body { 
      margin: 0; 
      padding-top: 40px; 
      background: #0d1117; /* GitHub Dark Mode Background */
      text-align: center; 
      font-family: 'Georgia', serif;
      color: #ffffff; /* White text */
    }
    img { 
      width: 100%; 
      height: auto; 
      margin-top: 20px; 
      display: block; 
    }
    h1 { 
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
      font-size: 4em; 
      margin: 20px 0; 
    }
    p { 
      font-size: 2em; 
      line-height: 1.6;
      margin: 20px auto; 
      max-width: 800px;
      text-align: center;
      padding: 0 20px;
    }
    .caption {
      font-size: 1.3em;
      color: #ffffff; /* White caption text */
      font-style: italic;
      margin: 8px 0 25px 0;
    }
    .back-button {
      display: inline-block;
      margin: 10px 0 60px 0;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
      border: 2px solid #ffffff;
      border-radius: 25px;
      transition: background 0.2s, color 0.2s;
    }
    .back-button:hover {
      background: #ffffff;
      color: #0d1117;
    }
    /* Elegant Gold Audio Button Styling */
    #audio-control {
      display: inline-block;
      margin: 20px auto;
      padding: 10px 25px;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1a365d;
      background: linear-gradient(135deg, #fff8e7 0%, #ffd700 50%, #fff8e7 100%);
      border: 2px solid #d4af37;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s ease;
    }
    #audio-control:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(212, 175, 55, 0.5);
    }
  </style>
</head>
<body>

  <!-- Hidden Audio Element -->
  <audio id="bg-music" src="Her.mp3" loop></audio>

  <!-- Elegant Custom Button -->
  <div id="audio-control" onclick="toggleAudio()">▶ Her</div>

  <!-- New Photo and Caption -->
  <img src="IMG_4406.jpeg">
  <div class="caption">Taken on August 9th, 2026</div>

  <h1>Dear Abby,</h1>
  <p>
  <p>I love you more and more everyday Abby,</p>
  <p>- Love, Evan</p>
  
  <div class="caption" style="margin-top: 40px;">12 Month Dating Anniversary 2026</div>

  <a href="index.html" class="back-button">Back to Home</a>

  <script>
    const audio = document.getElementById('bg-music');
    const control = document.getElementById('audio-control');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        control.innerText = "⏸ Her";
      } else {
        audio.pause();
        control.innerText = "▶ Her";
      }
    }
  </script>
</body>
</html>
